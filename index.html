<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길 비교 – 티맵, 카카오맵, 네이버지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEEB; --surface:#FFFFFF; --ink:#16211B; --muted:#5B6862; --line:#D3DBD6;
  --sign:#0A6B3B; --sign-ink:#FFFFFF; --sign-edge:#E6F2EA;
  --asphalt:#3A403D; --center:#F2C200;
  --tmap:#E5326B; --kakao:#F2CF00; --naver:#03C75A;
  --best:#0A6B3B; --err:#B3261E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101412; --surface:#181D1A; --ink:#E4EAE6; --muted:#98A49D; --line:#2A322D;
    --sign:#0D7642; --sign-edge:#CFE6D8; --asphalt:#4B524E;
    --best:#45C080; --err:#F2847C;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height:1.55;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
main{max-width:640px; margin:0 auto; padding:20px 16px 56px}
h1{font-size:1rem; font-weight:500; color:var(--muted); margin:4px 2px 12px}

/* 입력: 고속도로 표지판 */
.sign{background:var(--sign); color:var(--sign-ink); border-radius:12px; padding:6px}
.sign-inner{
  border:2px solid var(--sign-edge); border-radius:8px; padding:16px 14px 14px;
  display:grid; grid-template-columns:1fr auto; gap:12px 10px; align-items:center;
}
.row{display:grid; grid-template-columns:2.6em 1fr; align-items:center; gap:8px}
.row + .row{margin-top:10px}
.row label{font-weight:700; font-size:1.1rem}
.row input{
  width:100%; font:inherit; font-size:1.1rem; font-weight:700; color:var(--sign-ink);
  background:transparent; border:0; border-bottom:2px solid rgba(255,255,255,.45);
  padding:6px 2px; border-radius:0; outline:none;
}
.row input::placeholder{color:rgba(255,255,255,.6); font-weight:500}
.row input:focus{border-bottom-color:#fff}
#swap{
  width:44px; height:44px; border-radius:50%; border:2px solid var(--sign-edge);
  background:transparent; color:var(--sign-ink); font-size:1.2rem; cursor:pointer;
}
#go{
  grid-column:1 / -1; font:inherit; font-weight:700; font-size:1.05rem;
  background:var(--sign-edge); color:var(--sign); border:0; border-radius:6px;
  padding:12px; cursor:pointer;
}
#go:disabled{opacity:.6; cursor:wait}
button:focus-visible, a:focus-visible{outline:3px solid var(--center); outline-offset:2px}

#status{margin:14px 2px 0; color:var(--muted); min-height:1.5em}
#status.err{color:var(--err); font-weight:500}

/* 확정한 주소, 후보 목록 */
.row.has-btn{grid-template-columns:2.6em 1fr auto}
.row.has-btn .picked{grid-column:2 / -1}
#locate{font:inherit; font-weight:700; font-size:.9rem; color:var(--sign-ink); background:transparent; border:2px solid var(--sign-edge); border-radius:6px; min-height:40px; padding:0 10px; cursor:pointer}
#locate:disabled{opacity:.6; cursor:wait}
.row .picked{grid-column:2; font-size:.82rem; line-height:1.35; color:var(--sign-edge); margin:2px 2px 0}
.sugg{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.sugg-title{margin:0; padding:10px 12px; font-size:.85rem; color:var(--muted)}
.cand, .fav button.cand{
  display:block; width:100%; min-height:0; text-align:left; font:inherit; font-size:.95rem; font-weight:400;
  padding:10px 12px; border:0; border-top:1px solid var(--line); border-radius:0;
  background:transparent; color:var(--ink); cursor:pointer;
}
.cand b{font-weight:700}
.cand .cat{margin-left:6px; font-size:.75rem; color:var(--muted)}
.cand small{display:block; margin-top:2px; font-size:.82rem; color:var(--muted)}
.cand:active, .fav button.cand:active{background:var(--bg)}
.fav-picked{font-size:.82rem; color:var(--best)}
.fav-cands{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}

/* 자주 가는 곳 */
.fav{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:2px 12px}
.fav summary{cursor:pointer; padding:12px 0; font-weight:700; font-size:.95rem; list-style:none; display:flex; justify-content:space-between; align-items:center}
.fav summary::-webkit-details-marker{display:none}
.fav summary::after{content:"▾"; color:var(--muted)}
.fav[open] summary::after{content:"▴"}
.fav-row{display:grid; grid-template-columns:1fr auto auto auto; gap:6px; align-items:center; padding:8px 0; border-top:1px solid var(--line)}
.fav-label{min-width:0}
.fav-label b{display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fav-label small{display:block; color:var(--muted); font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fav button{font:inherit; font-size:.88rem; font-weight:700; min-height:40px; min-width:44px; padding:0 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer}
.fav button.on{background:var(--sign); color:var(--sign-ink); border-color:var(--sign)}
.fav button.fav-edit{font-weight:400; color:var(--muted)}
.fav button.fav-add{grid-column:1 / -1; text-align:left; border-style:dashed; color:var(--muted); font-weight:400}
.fav-form{display:grid; gap:8px; padding:10px 0; border-top:1px solid var(--line)}
.fav-form input{font:inherit; font-size:1rem; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); width:100%}
.fav-form .btns{display:flex; gap:6px}
.fav-form .btns button.primary{background:var(--sign); color:var(--sign-ink); border-color:var(--sign)}

/* 결과 */
#out{margin-top:18px}
#headline{font-size:1.45rem; font-weight:700; line-height:1.3; margin:0 2px 6px}
.places{margin:0 2px 18px; color:var(--muted); font-size:.92rem}

.lanes{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 12px; display:grid; gap:12px}
.lane{display:grid; grid-template-columns:5.6em 1fr 4.8em; align-items:center; gap:10px}
.lane-name{font-weight:500; font-size:.95rem; display:flex; align-items:center; gap:6px; white-space:nowrap}
.dot{width:10px; height:10px; border-radius:50%; flex:none}
.road{height:18px; position:relative}
.road-fill{
  height:100%; border-radius:3px; background:var(--asphalt); position:relative; min-width:8px;
  transform-origin:left; animation:drive .7s ease-out both;
}
.road-fill::after{
  content:""; position:absolute; left:6px; right:6px; top:50%; height:2px; margin-top:-1px;
  background:repeating-linear-gradient(90deg, var(--center) 0 10px, transparent 10px 18px);
}
.lane.best .road-fill{background:var(--best)}
.road-none{color:var(--muted); font-size:.85rem}
.lane-time{text-align:right; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.lane.best .lane-time{color:var(--best)}
@keyframes drive{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.road-fill{animation:none}}

.table-wrap{overflow-x:auto; margin-top:16px}
table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:.95rem}
th, td{padding:10px 8px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
th:first-child, td:first-child{text-align:left; color:var(--muted); font-weight:500; white-space:nowrap}
thead th{font-weight:700; color:var(--ink); border-top:4px solid var(--c, var(--line))}
thead th:first-child{border-top-color:var(--line)}
tr:last-child td{border-bottom:0}
td.best{color:var(--best); font-weight:700}
.diff{display:block; font-size:.8rem; color:var(--muted); font-weight:400}
.fail{color:var(--err); font-size:.82rem; text-align:right}
.open{
  display:inline-block; padding:7px 10px; border-radius:6px; text-decoration:none;
  font-weight:700; font-size:.88rem; background:var(--bg); color:var(--ink); border:1px solid var(--line);
}
.open.off{color:var(--muted); font-weight:400; border-style:dashed}
.note{color:var(--muted); font-size:.82rem; margin:10px 2px 0}
</style>
</head>
<body>
<main>
  <h1>티맵, 카카오맵, 네이버지도 경로를 한 번에 비교합니다</h1>

  <form id="f" class="sign" autocomplete="off">
    <div class="sign-inner">
      <div>
        <div class="row has-btn"><label for="from">출발</label><input id="from" name="from" placeholder="주소나 장소 이름" enterkeyhint="next"><button type="button" id="locate" aria-label="현재 위치를 출발지로 넣기">현위치</button><div class="picked" id="pk-from" hidden></div></div>
        <div class="row"><label for="to">도착</label><input id="to" name="to" placeholder="주소나 장소 이름" enterkeyhint="go"><div class="picked" id="pk-to" hidden></div></div>
      </div>
      <button type="button" id="swap" aria-label="출발지와 도착지 바꾸기">⇅</button>
      <button type="submit" id="go">경로 비교</button>
    </div>
  </form>

  <div id="sugg" class="sugg" hidden aria-live="polite"></div>

  <p id="status" role="status"></p>

  <details class="fav" open>
    <summary>자주 가는 곳</summary>
    <div id="favBody"></div>
  </details>

  <section id="out" hidden>
    <p id="headline"></p>
    <p id="places" class="places"></p>
    <div id="lanes" class="lanes"></div>
    <div class="table-wrap"><table id="tbl"></table></div>
    <p class="note" id="note"></p>
  </section>
</main>

<script>
// 배포한 Cloudflare Worker 주소로 바꿔주세요
const WORKER_URL = 'https://navi-compare.daveheo89.workers.dev';

const SERVICES = [
  { id: 'tmap',  name: '티맵',     color: 'var(--tmap)'  },
  { id: 'kakao', name: '카카오맵', color: 'var(--kakao)' },
  { id: 'naver', name: '네이버지도', color: 'var(--naver)' },
];
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtTime = sec => {
  const m = Math.round(sec / 60);
  if (m < 60) return `${m}분`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}시간 ${r}분` : `${h}시간`;
};
const fmtDist = m => m >= 1000 ? `${(m / 1000).toFixed(1)}km` : `${m}m`;
const fmtWon = w => w == null ? '–' : w === 0 ? '없음' : `${Number(w).toLocaleString('ko-KR')}원`;

function deepLinks(o, d) {
  const clean = s => String(s).replace(/[,/]/g, ' ');
  return {
    tmap: isMobile
      ? `tmap://route?startx=${o.lng}&starty=${o.lat}&goalx=${d.lng}&goaly=${d.lat}&goalname=${enc(clean(d.name))}`
      : null,
    kakao: `https://map.kakao.com/link/by/car/${enc(clean(o.name))},${o.lat},${o.lng}/${enc(clean(d.name))},${d.lat},${d.lng}`,
    naver: isMobile
      ? `nmap://route/car?slat=${o.lat}&slng=${o.lng}&sname=${enc(clean(o.name))}&dlat=${d.lat}&dlng=${d.lng}&dname=${enc(clean(d.name))}&appname=${enc(location.hostname || 'navi-compare')}`
      : `https://map.naver.com/p/search/${enc(clean(d.name))}`,
  };
}

function setStatus(msg, isErr) {
  $('status').textContent = msg;
  $('status').classList.toggle('err', !!isErr);
}

function render(data) {
  const { origin: o, dest: d, results } = data;
  const okList = SERVICES.filter(s => results[s.id]?.ok);
  const minD = okList.length ? Math.min(...okList.map(s => results[s.id].duration)) : 0;
  const maxD = okList.length ? Math.max(...okList.map(s => results[s.id].duration)) : 1;
  const bestNames = okList.filter(s => results[s.id].duration === minD).map(s => s.name);

  $('headline').textContent = okList.length
    ? `가장 빠른 길은 ${bestNames.join(', ')}, ${fmtTime(minD)}`
    : '세 곳 모두 경로를 받지 못했어요';
  const af = picked.from ? ` (${esc(picked.from.addr)})` : '', ad = picked.to ? ` (${esc(picked.to.addr)})` : '';
  $('places').innerHTML = `출발 ${esc(o.name)}${af}<br>도착 ${esc(d.name)}${ad}`;

  // 차선 막대
  $('lanes').innerHTML = SERVICES.map(s => {
    const r = results[s.id];
    const head = `<div class="lane-name"><span class="dot" style="background:${s.color}"></span>${s.name}</div>`;
    if (!r?.ok) return `<div class="lane">${head}<div class="road road-none">결과 없음</div><div class="lane-time">–</div></div>`;
    const best = r.duration === minD;
    const pct = Math.max(8, Math.round(r.duration / maxD * 100));
    return `<div class="lane${best ? ' best' : ''}">${head}
      <div class="road"><div class="road-fill" style="width:${pct}%"></div></div>
      <div class="lane-time">${fmtTime(r.duration)}</div></div>`;
  }).join('');

  // 비교표
  const links = deepLinks(o, d);
  const cell = (s, fn) => {
    const r = results[s.id];
    return r?.ok ? fn(r) : `<td class="fail">${esc(r?.error || '오류')}</td>`;
  };
  const rows = [
    ['소요시간', s => cell(s, r => {
      const diff = Math.round((r.duration - minD) / 60);
      const best = r.duration === minD;
      return `<td class="${best ? 'best' : ''}">${fmtTime(r.duration)}${!best && diff > 0 ? `<span class="diff">+${diff}분</span>` : ''}</td>`;
    })],
    ['거리', s => cell(s, r => `<td>${fmtDist(r.distance)}</td>`)],
    ['통행료', s => cell(s, r => `<td>${fmtWon(r.toll)}</td>`)],
    ['택시비', s => cell(s, r => `<td>${fmtWon(r.taxi)}</td>`)],
    ['', s => links[s.id]
      ? `<td><a class="open" href="${esc(links[s.id])}" target="_blank" rel="noopener">${isMobile ? '앱 열기' : '지도 열기'}</a></td>`
      : `<td><span class="open off">모바일 전용</span></td>`],
  ];
  $('tbl').innerHTML =
    `<thead><tr><th></th>${SERVICES.map(s => `<th style="--c:${s.color}">${s.name}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.map(([label, fn]) => `<tr><td>${label}</td>${SERVICES.map(fn).join('')}</tr>`).join('')}</tbody>`;

  $('note').textContent = isMobile
    ? '앱 열기는 해당 앱이 설치되어 있어야 동작해요. 앱 안내 시간은 실시간 교통에 따라 이 표와 조금 다를 수 있어요.'
    : 'PC에서는 카카오맵은 경로, 네이버지도는 도착지 검색으로 열려요. 티맵은 휴대폰에서 열어주세요.';
  $('out').hidden = false;
}

// ---------- 장소 검색 (후보 목록) ----------
const searchCache = new Map();
const picked = { from: null, to: null };   // 후보에서 확정한 장소 { name, addr, lat, lng }
let suggFor = null, suggItems = [], suggTimer = 0, suggSeq = 0, pendingSubmit = false;

async function searchPlaces(q) {
  q = q.trim();
  if (searchCache.has(q)) return searchCache.get(q);
  let res;
  try { res = await fetch(`${WORKER_URL}/search?q=${enc(q)}`); }
  catch { throw new Error('Worker에 연결하지 못했어요. WORKER_URL과 ALLOWED_ORIGINS 설정을 확인하세요.'); }
  const data = await res.json().catch(() => ({ error: `서버 응답을 읽을 수 없어요 (${res.status}).` }));
  if (res.status === 404) throw new Error('Worker에 검색 기능이 없어요. 새 worker.js를 붙여넣고 Deploy하세요.');
  if (!res.ok || data.error) throw new Error(data.error || `검색 실패 (${res.status})`);
  const items = Array.isArray(data.items) ? data.items : [];
  searchCache.set(q, items);
  return items;
}

function candHtml(items, attr) {
  return items.map((it, k) =>
    `<button type="button" class="cand" ${attr}="${k}"><b>${esc(it.name)}</b>${it.cat ? `<span class="cat">${esc(it.cat)}</span>` : ''}<small>${esc(it.addr)}</small></button>`
  ).join('');
}

function setPickedLine(id) {
  const el = $('pk-' + id), p = picked[id];
  el.textContent = p ? `✓ ${p.addr}` : '';
  el.hidden = !p;
}

function hideSugg() {
  clearTimeout(suggTimer); suggSeq++;
  suggFor = null; suggItems = [];
  $('sugg').hidden = true; $('sugg').innerHTML = '';
}

function showSugg(id, q, items) {
  suggFor = id; suggItems = items;
  const label = id === 'from' ? '출발지' : '도착지';
  $('sugg').hidden = false;
  $('sugg').innerHTML = items.length
    ? `<p class="sugg-title">${label} 후보, '${esc(q)}' 검색 결과 ${items.length}곳. 맞는 곳을 누르세요.</p>${candHtml(items, 'data-k')}`
    : `<p class="sugg-title">'${esc(q)}' 검색 결과가 없어요. 주소를 더 자세히 입력해 보세요.</p>`;
}

function choose(id, item) {
  picked[id] = item;
  $(id).value = item.name;
  setPickedLine(id); hideSugg(); markActive(); setStatus('');
  if (pendingSubmit) { pendingSubmit = false; $('f').requestSubmit(); }
}

async function resolveField(id) {
  if (picked[id]) return picked[id];
  const q = $(id).value.trim();
  const items = await searchPlaces(q);
  if (!items.length) throw new Error(`'${q}' 위치를 찾지 못했어요. 주소를 더 자세히 입력해 보세요.`);
  if (items.length === 1) { picked[id] = items[0]; setPickedLine(id); return items[0]; }
  showSugg(id, q, items);
  pendingSubmit = true;
  return null;
}

$('sugg').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b || !suggFor) return;
  const item = suggItems[Number(b.dataset.k)];
  if (item) choose(suggFor, item);
});

['from', 'to'].forEach(id => $(id).addEventListener('input', () => {
  picked[id] = null; setPickedLine(id); pendingSubmit = false; markActive();
  clearTimeout(suggTimer);
  const q = $(id).value.trim();
  if (q.length < 2) { suggSeq++; if (suggFor === id) hideSugg(); return; }
  const seq = ++suggSeq;
  suggTimer = setTimeout(async () => {
    try {
      const items = await searchPlaces(q);
      if (seq !== suggSeq || $(id).value.trim() !== q) return;
      showSugg(id, q, items);
    } catch (err) {
      if (seq === suggSeq) { hideSugg(); setStatus(err.message, true); }
    }
  }, 300);
}));

// ---------- 자주 가는 곳 (최대 5개) ----------
// 모든 기기에 똑같이 고정하고 싶으면 아래 목록에 적어두세요.
// 예: { name: '집', addr: '경기도 의정부시 ○○로 12', lat: 37.7, lng: 127.0 }  (lat, lng는 생략 가능)
const DEFAULT_PLACES = [];
const FAV_KEY = 'navi-places', FAV_SLOTS = 5;
let places = loadPlaces();
let editing = -1, editPick = null, favCandItems = [], favTimer = 0, favSeq = 0;

function loadPlaces() {
  let list = null;
  try { const raw = localStorage.getItem(FAV_KEY); if (raw) list = JSON.parse(raw); } catch {}
  if (!Array.isArray(list)) list = DEFAULT_PLACES;
  return Array.from({ length: FAV_SLOTS }, (_, i) => {
    const p = list[i];
    if (!(p && p.name && p.addr)) return null;
    const out = { name: String(p.name), addr: String(p.addr) };
    if (Number.isFinite(p.lat) && Number.isFinite(p.lng)) { out.lat = p.lat; out.lng = p.lng; }
    return out;
  });
}
function savePlaces() { try { localStorage.setItem(FAV_KEY, JSON.stringify(places)); } catch {} }
const hasPoint = p => !!p && Number.isFinite(p.lat) && Number.isFinite(p.lng);

function markActive() {
  document.querySelectorAll('#favBody [data-act="from"], #favBody [data-act="to"]').forEach(b => {
    const id = b.dataset.act, p = places[Number(b.dataset.i)], pk = picked[id];
    const on = !!p && (hasPoint(p) ? !!pk && pk.lat === p.lat && pk.lng === p.lng : !pk && p.addr === $(id).value.trim());
    b.classList.toggle('on', on);
  });
}

function renderFav() {
  $('favBody').innerHTML = places.map((p, i) => {
    if (editing === i) {
      return `<div class="fav-form">
        <input id="favName" placeholder="이름 (예: 집, 회사)" maxlength="20" value="${esc(p ? p.name : '')}" aria-label="장소 이름">
        <input id="favAddr" placeholder="주소나 장소 이름을 검색하세요" value="${esc(p ? p.addr : '')}" aria-label="주소">
        <div id="favPicked" class="fav-picked">${editPick ? '✓ ' + esc(editPick.addr) : ''}</div>
        <div id="favCands" class="fav-cands" hidden></div>
        <div class="btns">
          <button type="button" class="primary" data-act="save" data-i="${i}">저장</button>
          ${p ? `<button type="button" data-act="del" data-i="${i}">삭제</button>` : ''}
          <button type="button" data-act="cancel" data-i="${i}">취소</button>
        </div>
      </div>`;
    }
    if (!p) return `<div class="fav-row"><button type="button" class="fav-add" data-act="edit" data-i="${i}">+ 장소 추가</button></div>`;
    return `<div class="fav-row">
      <div class="fav-label"><b>${esc(p.name)}</b><small>${esc(p.addr)}</small></div>
      <button type="button" data-act="from" data-i="${i}">출발</button>
      <button type="button" data-act="to" data-i="${i}">도착</button>
      <button type="button" class="fav-edit" data-act="edit" data-i="${i}" aria-label="${esc(p.name)} 수정">✎</button>
    </div>`;
  }).join('');
  markActive();
  if (editing >= 0) { const el = $('favName'); if (el) el.focus(); }
}

function hideFavCands() {
  favSeq++; favCandItems = [];
  const el = $('favCands'); if (el) { el.hidden = true; el.innerHTML = ''; }
}
function showFavCands(items, q) {
  const el = $('favCands'); if (!el) return;
  favCandItems = items;
  el.hidden = false;
  el.innerHTML = items.length
    ? `<p class="sugg-title">'${esc(q)}' 검색 결과 ${items.length}곳. 맞는 곳을 누르세요.</p>${candHtml(items, 'data-fk')}`
    : `<p class="sugg-title">'${esc(q)}' 검색 결과가 없어요. 주소를 더 자세히 입력해 보세요.</p>`;
}

$('favBody').addEventListener('click', async e => {
  const fk = e.target.closest('button[data-fk]');
  if (fk) {
    const it = favCandItems[Number(fk.dataset.fk)];
    if (!it) return;
    editPick = it;
    $('favAddr').value = it.addr;
    if (!$('favName').value.trim()) $('favName').value = it.name;
    $('favPicked').textContent = '✓ ' + it.addr;
    hideFavCands();
    return;
  }
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const i = Number(b.dataset.i), act = b.dataset.act, p = places[i];
  if (act === 'from' || act === 'to') {
    if (!p) return;
    hideSugg(); pendingSubmit = false;
    if (hasPoint(p)) { picked[act] = { name: p.name, addr: p.addr, lat: p.lat, lng: p.lng }; $(act).value = p.name; }
    else { picked[act] = null; $(act).value = p.addr; }
    setPickedLine(act); markActive();
    setStatus(`${p.name}을(를) ${act === 'from' ? '출발지' : '도착지'}로 넣었어요.`);
  } else if (act === 'edit') {
    editing = i; editPick = hasPoint(p) ? { name: p.name, addr: p.addr, lat: p.lat, lng: p.lng } : null; favCandItems = [];
    renderFav();
  } else if (act === 'cancel') {
    editing = -1; editPick = null; renderFav();
  } else if (act === 'del') {
    places[i] = null; savePlaces(); editing = -1; editPick = null; renderFav(); setStatus('');
  } else if (act === 'save') {
    const name = $('favName').value.trim(), addr = $('favAddr').value.trim();
    if (!name || !addr) { setStatus('이름과 주소를 모두 입력하세요.', true); return; }
    let pk = editPick;
    if (!pk) {
      b.disabled = true;
      try {
        const items = await searchPlaces(addr);
        if (!items.length) { setStatus(`'${addr}' 위치를 찾지 못했어요. 주소를 더 자세히 입력해 보세요.`, true); return; }
        if (items.length > 1) { showFavCands(items, addr); setStatus('후보가 여러 곳이에요. 맞는 곳을 골라주세요.'); return; }
        pk = items[0];
      } catch (err) { setStatus(err.message, true); return; }
      finally { b.disabled = false; }
    }
    places[i] = { name, addr: pk.addr, lat: pk.lat, lng: pk.lng };
    savePlaces(); editing = -1; editPick = null; renderFav(); setStatus('');
  }
});

$('favBody').addEventListener('input', e => {
  if (e.target.id !== 'favAddr') return;
  editPick = null; $('favPicked').textContent = '';
  clearTimeout(favTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { hideFavCands(); return; }
  const seq = ++favSeq;
  favTimer = setTimeout(async () => {
    try {
      const items = await searchPlaces(q);
      if (seq !== favSeq || !$('favAddr') || $('favAddr').value.trim() !== q) return;
      showFavCands(items, q);
    } catch (err) { if (seq === favSeq) setStatus(err.message, true); }
  }, 300);
});

$('favBody').addEventListener('keydown', e => {
  const form = e.target.closest && e.target.closest('.fav-form');
  if (e.key === 'Enter' && form) { e.preventDefault(); form.querySelector('[data-act="save"]').click(); }
});

$('locate').addEventListener('click', () => {
  if (!navigator.geolocation || !window.isSecureContext) {
    setStatus('이 브라우저에서는 현재 위치를 쓸 수 없어요. 주소를 직접 입력해 주세요.', true); return;
  }
  const btn = $('locate');
  btn.disabled = true; pendingSubmit = false; hideSugg();
  setStatus('현재 위치를 찾는 중…');
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    let addr = `현재 위치 (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
    try {
      const res = await fetch(`${WORKER_URL}/reverse?lat=${lat}&lng=${lng}`);
      const data = await res.json();
      if (res.ok && data.addr) addr = data.addr + (data.building ? ` (${data.building})` : '');
    } catch {}
    picked.from = { name: '현재 위치', addr, lat, lng, live: true };
    $('from').value = '현재 위치';
    setPickedLine('from'); markActive(); setStatus('');
    btn.disabled = false;
  }, err => {
    btn.disabled = false;
    setStatus(
      err.code === 1 ? '위치 권한이 꺼져 있어요. 주소창 왼쪽 아이콘에서 위치를 허용한 뒤 다시 눌러주세요.'
      : err.code === 3 ? '위치를 찾는 데 시간이 오래 걸려요. 다시 눌러주세요.'
      : '현재 위치를 가져오지 못했어요. 주소를 직접 입력해 주세요.', true);
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
});

$('swap').addEventListener('click', () => {
  const a = $('from').value; $('from').value = $('to').value; $('to').value = a;
  [picked.from, picked.to] = [picked.to, picked.from];
  setPickedLine('from'); setPickedLine('to');
  hideSugg(); pendingSubmit = false; markActive();
});

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const fromTxt = $('from').value.trim(), toTxt = $('to').value.trim();
  if (!fromTxt || !toTxt) { setStatus('출발지와 도착지를 모두 입력하세요.', true); return; }
  if (WORKER_URL.includes('YOUR-')) { setStatus('index.html의 WORKER_URL을 배포한 Worker 주소로 바꿔주세요.', true); return; }

  $('go').disabled = true;
  pendingSubmit = false;
  try {
    setStatus('장소를 확인하는 중…');
    const o = await resolveField('from');
    if (!o) { setStatus('출발지 후보가 여러 곳이에요. 아래에서 맞는 곳을 골라주세요.'); $('sugg').scrollIntoView({ block: 'nearest' }); return; }
    const d = await resolveField('to');
    if (!d) { setStatus('도착지 후보가 여러 곳이에요. 아래에서 맞는 곳을 골라주세요.'); $('sugg').scrollIntoView({ block: 'nearest' }); return; }

    setStatus('티맵, 카카오맵, 네이버지도에 경로를 묻는 중…');
    const qs = new URLSearchParams({ fromLat: o.lat, fromLng: o.lng, fromName: o.name, toLat: d.lat, toLng: d.lng, toName: d.name });
    let res;
    try { res = await fetch(`${WORKER_URL}/compare?${qs}`); }
    catch { throw new Error('Worker에 연결하지 못했어요. WORKER_URL과 ALLOWED_ORIGINS 설정을 확인하세요.'); }
    const data = await res.json().catch(() => ({ error: `서버 응답을 읽을 수 없어요 (${res.status}).` }));
    if (!res.ok || data.error) throw new Error(data.error || `요청 실패 (${res.status})`);
    render(data);
    setStatus('');
    const live = !!(o.live || d.live);   // 현재 위치는 저장하거나 공유 링크에 담지 않는다
    try { localStorage.setItem('navi-last', JSON.stringify({ from: o.live ? null : o, to: d.live ? null : d })); } catch {}
    history.replaceState(null, '', live ? location.pathname : '?' + new URLSearchParams({
      from: o.name, to: d.name, fc: `${o.lat},${o.lng}`, tc: `${d.lat},${d.lng}`, fa: o.addr, ta: d.addr,
    }));
  } catch (err) {
    setStatus(err.message || '요청에 실패했어요.', true);
  } finally {
    $('go').disabled = false;
  }
});

// 주소창에 ?from=&to= 가 있으면 바로 비교, 없으면 마지막 입력 복원
(() => {
  const p = new URLSearchParams(location.search);
  if (p.get('from') && p.get('to')) {
    for (const [id, c, a] of [['from', 'fc', 'fa'], ['to', 'tc', 'ta']]) {
      $(id).value = p.get(id);
      const m = (p.get(c) || '').split(',');
      if (m.length === 2) {
        const lat = Number(m[0]), lng = Number(m[1]);
        if (Number.isFinite(lat) && Number.isFinite(lng)) picked[id] = { name: p.get(id), addr: p.get(a) || p.get(id), lat, lng };
      }
      setPickedLine(id);
    }
    $('f').requestSubmit();
    return;
  }
  try {
    const last = JSON.parse(localStorage.getItem('navi-last') || 'null');
    if (last) for (const id of ['from', 'to']) {
      const v = last[id];
      if (v && typeof v === 'object' && Number.isFinite(v.lat) && Number.isFinite(v.lng)) {
        $(id).value = String(v.name || ''); picked[id] = { name: String(v.name || ''), addr: String(v.addr || v.name || ''), lat: v.lat, lng: v.lng };
      } else if (typeof v === 'string') $(id).value = v;
      setPickedLine(id);
    }
  } catch {}
})();
renderFav();
</script>
</body>
</html>
